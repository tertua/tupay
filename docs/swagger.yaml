info:
  contact:
    name: API Support
  description: |-
    TuPay API. Two prefixes serve the same routes: /api/v1
    (current, used by the MPA) and /api (legacy, deprecated —
    responses carry a Sunset header). Unless tagged otherwise,
    endpoints speak JSON with this envelope. Success: the data
    keys directly, e.g. {"expense": {...}} or
    {"invoices": [...], "meta": {"page": 1, "per_page": 20, "total": 42}}.
    List endpoints accept ?page (default 1) and ?per_page
    (default 20, max 100) and always return a meta object.
    Errors: {"error": {"message": "...", "details": {...}}} with a
    stable English message (translated client-side via i18n api.*
    keys). Logout answers 204 with no body; most DELETEs do too,
    except DELETE /payments/:id which voids and answers 200.

    Auth — three independent schemes, never mixed:
    1. SessionCookie (most endpoints): login/register set
    HttpOnly access_token + refresh_token cookies. Send cookies
    with every request (fetch: credentials:include). An expired
    access token is refreshed transparently from the refresh
    cookie. A Bearer access token in the Authorization header
    works as a fallback where cookies are unavailable.
    2. CSRF double-submit (session-cookie POST/PATCH/DELETE only):
    login/register also set a readable csrf_token cookie — echo
    it back as the X-CSRF-Token header or the mutation is
    rejected with 403. Public GETs and API-key calls are exempt.
    3. ApiKeyAuth (service relay /gateway/* only): pass the
    project API key as the Authorization header; cookie sessions
    are never accepted there.
    Mutations that create money movement accept an Idempotency-Key
    header (one UUID per intent); replays return the original
    result instead of duplicating. Login/register/forgot-password
    are behind Cloudflare Turnstile when a secret is configured
    (captcha token required) and rate-limited; AI endpoints answer
    501 without GEMINI_API_KEY.
  license:
    name: GNU AGPLv3
    url: https://www.gnu.org/licenses/agpl-3.0.html
  termsOfService: http://swagger.io/terms/
  title: TuPay API
  version: "1.0"
paths:
  /admin/audit-logs:
    get:
      description: List audit trail entries.
      parameters:
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Items per page (default 20, max 100)
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - SessionCookie: []
      summary: list audit trail
      tags:
      - Admin
  /admin/gateway/deliveries:
    get:
      description: List relay deliveries.
      parameters:
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Items per page (default 20, max 100)
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: list relay deliveries
      tags:
      - Admin
  /admin/gateway/deliveries/{id}/retry:
    post:
      description: Retry a relay delivery.
      parameters:
      - description: Delivery ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: retry relay delivery
      tags:
      - Admin
  /admin/gateway/projects:
    get:
      description: List gateway projects.
      parameters:
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Items per page (default 20, max 100)
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: list gateway projects
      tags:
      - Admin
    post:
      consumes:
      - application/json
      description: Register a downstream project.
      parameters:
      - description: Project payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.CreateProjectInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
      summary: create gateway project
      tags:
      - Admin
  /admin/gateway/projects/{slug}:
    delete:
      description: Delete an unused gateway project.
      parameters:
      - description: Project slug
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
      summary: delete gateway project
      tags:
      - Admin
    patch:
      consumes:
      - application/json
      description: Update a gateway project.
      parameters:
      - description: Project slug
        in: path
        name: slug
        required: true
        type: string
      - description: Project payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.UpdateProjectInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: update gateway project
      tags:
      - Admin
  /admin/gateway/projects/{slug}/rotate-key:
    post:
      description: Rotate a project API key.
      parameters:
      - description: Project slug
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: rotate project key
      tags:
      - Admin
  /admin/gateway/projects/{slug}/rotate-secret:
    post:
      description: Rotate a project webhook secret.
      parameters:
      - description: Project slug
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: rotate project secret
      tags:
      - Admin
  /admin/gateway/settlement:
    get:
      description: Settlement summary grouped by transaction status.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: settlement summary
      tags:
      - Admin
  /admin/gateway/transactions:
    get:
      description: List relay transactions.
      parameters:
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Items per page (default 20, max 100)
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: list relay transactions
      tags:
      - Admin
  /admin/migrate/down:
    post:
      consumes:
      - application/json
      description: Roll the database schema back to a previous version.
      parameters:
      - description: Target version plus explicit confirmation
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.MigrateDownInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - SessionCookie: []
      summary: rollback schema version
      tags:
      - Admin
  /admin/orgs:
    post:
      consumes:
      - application/json
      description: Create an organization and assign its owner.
      parameters:
      - description: Organization payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.CreateOrgInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - SessionCookie: []
      summary: create organization
      tags:
      - Admin
  /admin/outbox/status:
    get:
      description: Queue depth per status for every outbox queue, with oldest pending/processing
        age and worker poll settings.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - SessionCookie: []
      summary: get outbox queue status
      tags:
      - Admin
  /admin/users:
    get:
      description: List registered users.
      parameters:
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Items per page (default 20, max 100)
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - SessionCookie: []
      summary: list users
      tags:
      - Admin
  /admin/users/{id}/role:
    patch:
      consumes:
      - application/json
      description: Update a user's role.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      - description: Role payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.RoleInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - SessionCookie: []
      summary: update user role
      tags:
      - Admin
  /admin/users/{id}/status:
    patch:
      consumes:
      - application/json
      description: Block or unblock a user account.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      - description: Status payload (0=blocked, 1=active)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.StatusInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - SessionCookie: []
      summary: update user status
      tags:
      - Admin
  /ai/business-summary:
    post:
      description: Generate an AI business summary.
      parameters:
      - description: 'Answer language: en or id (default en)'
        in: header
        name: X-Locale
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - SessionCookie: []
      summary: generate business summary
      tags:
      - AI
  /ai/payment-reminder:
    post:
      consumes:
      - application/json
      description: Generate an AI payment reminder.
      parameters:
      - description: Reminder payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.PaymentReminderInput'
      - description: 'Answer language: en or id (default en)'
        in: header
        name: X-Locale
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - SessionCookie: []
      summary: generate payment reminder
      tags:
      - AI
  /ai/receipt-parse:
    post:
      consumes:
      - multipart/form-data
      description: Parse a receipt with Gemini.
      parameters:
      - description: Receipt image or PDF
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - SessionCookie: []
      summary: parse receipt
      tags:
      - AI
  /ai/write-note:
    post:
      consumes:
      - application/json
      description: Generate invoice notes or terms.
      parameters:
      - description: Note payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.WriteNoteInput'
      - description: 'Answer language: en or id (default en)'
        in: header
        name: X-Locale
        type: string
      produces:
      - application/json
      responses:
        "200":
