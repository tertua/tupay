      name:
        maxLength: 120
        type: string
      notes:
        type: string
      payment_method:
        description: PaymentMethod mirrors the Invoice column; see the comment there.
        enum:
        - Cash
        - Bank transfer
        - Online
        maxLength: 32
        type: string
      start_date:
        type: string
      status:
        enum:
        - active
        - paused
        type: string
      tax_rate:
        minimum: 0
        type: number
      terms:
        type: string
    required:
    - cadence
    - currency
    - invoice_status
    - items
    - name
    - status
    type: object
  models.SubscriptionStatusInput:
    properties:
      status:
        enum:
        - active
        - paused
        type: string
    required:
    - status
    type: object
  models.UpdateEndpointInput:
    properties:
      events:
        maxLength: 255
        type: string
      is_active:
        type: boolean
      target_url:
        maxLength: 1024
        type: string
    type: object
  models.UpdateProfile:
    properties:
      name:
        maxLength: 255
        type: string
    required:
    - name
    type: object
  models.UpdateProjectInput:
    properties:
      default_gateway:
        maxLength: 32
        type: string
      is_active:
        type: boolean
      name:
        maxLength: 255
        type: string
      webhook_url:
        maxLength: 1024
        type: string
    type: object
  models.VerifyEmail:
    properties:
      token:
        maxLength: 255
        type: string
    required:
    - token
    type: object
  models.WriteNoteInput:
    properties:
      client:
        additionalProperties: {}
        type: object
